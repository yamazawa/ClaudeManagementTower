<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Claude管理塔</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <div class="header-top">
    <h1>Claude管理塔</h1>
    <div id="token-usage" class="token-usage" aria-label="Claudeトークン使用状況"></div>
  </div>
  <div class="header-bottom">
    <div id="mr-status-filter" role="group" aria-label="MRステータスでの絞り込み"></div>
    <button type="button" id="deploy-button" class="header-deploy-button">Deploy</button>
    <span id="deploy-status" class="header-deploy-status" role="status"></span>
  </div>
</header>

<main id="issue-view">
  <section id="project-list" aria-label="リポジトリ一覧">
    <div class="section-title-row">
      <button type="button" class="expander" aria-expanded="true" aria-label="開閉"></button>
      <h2>リポジトリ一覧</h2>
    </div>
    <ul id="project-list-items"></ul>
  </section>
  <section id="issue-list" aria-label="Issue一覧" hidden>
    <div class="section-title-row">
      <button type="button" class="expander" aria-expanded="true" aria-label="開閉"></button>
      <h2 id="repo-heading" class="title-heading">Repo</h2>
    </div>
    <p id="issue-list-placeholder" class="empty">一覧からリポジトリを選択してください。</p>
    <div id="issue-panel" hidden>
      <div id="issue-create-block" class="create-block">
        <h3 class="section-heading section-heading-top">Issue作成</h3>
        <form id="issue-create-form">
          <input type="text" name="title" placeholder="タイトル" required />
          <button type="submit">Create</button>
          <p id="issue-create-status" class="empty"></p>
        </form>
      </div>
      <h3 class="section-heading section-heading-with-filter">
        Issue一覧
        <select id="issue-filter" class="heading-filter" aria-label="Issue一覧の表示フィルタ">
          <option value="open" selected>Open</option>
          <option value="closed_today">Close（Today）</option>
          <option value="closed">Close</option>
        </select>
      </h3>
      <ul id="issue-list-items"></ul>
    </div>
  </section>
  <section id="subtask-list" aria-label="Issue内容" hidden>
    <div class="section-title-row">
      <button type="button" class="expander" aria-expanded="true" aria-label="開閉"></button>
      <h2 id="issue-heading" class="title-heading">Issue</h2>
    </div>
    <div id="subtask-list-body">
      <p class="empty">一覧からIssueを選択してください。</p>
    </div>
    <div id="subtask-panel" hidden>
      <div id="subtask-create-block" class="create-block">
        <h3 class="section-heading section-heading-top">MR作成</h3>
        <form id="subtask-form">
          <span id="subtask-form-prefix" class="subtask-form-prefix"><span id="subtask-form-prefix-title" class="subtask-form-prefix-title"></span><span id="subtask-form-prefix-separator"></span></span>
          <input type="text" name="title" placeholder="MR名（空欄なら連番）" />
          <button type="submit">Create</button>
          <p id="subtask-form-status" class="empty"></p>
        </form>
      </div>
      <h3 class="section-heading section-heading-with-filter">
        MR一覧
        <select id="subtask-filter" class="heading-filter" aria-label="MR一覧の表示フィルタ">
          <option value="unresolved" selected>未解決</option>
          <option value="solved">解決済</option>
        </select>
      </h3>
      <div id="subtask-list-container"></div>
    </div>
  </section>
  <section id="subtask-detail" aria-label="MR内容" hidden>
    <div class="section-title-row">
      <button type="button" class="expander" aria-expanded="true" aria-label="開閉"></button>
      <h2 id="subtask-heading" class="title-heading">MR</h2>
    </div>
    <div id="subtask-detail-body">
      <p class="empty">一覧からMRを選択してください。</p>
    </div>
  </section>
</main>

<div id="selection-busy" class="selection-busy" role="status" aria-live="polite" hidden>
  <span class="selection-busy-label"><span class="selection-busy-spinner" aria-hidden="true"></span>更新中…</span>
</div>

<dialog id="image-editor" class="image-editor" aria-label="画像添付の編集">
  <div class="image-editor-toolbar">
    <span class="image-editor-hint">ドラッグで選択中の線（赤枠／ペン）、タップで丸数字（①、②…）を描けます</span>
    <span class="image-editor-tools" role="group" aria-label="ドラッグで描く線">
      <button type="button" class="subtask-action-button image-editor-tool" data-tool="rect" aria-pressed="true">赤枠</button>
      <button type="button" class="subtask-action-button image-editor-tool" data-tool="pen" aria-pressed="false">ペン</button>
    </span>
    <button type="button" id="image-editor-undo" class="subtask-action-button">元に戻す</button>
    <button type="button" id="image-editor-cancel" class="subtask-action-button">キャンセル</button>
    <button type="button" id="image-editor-attach" class="subtask-action-button primary">添付</button>
  </div>
  <div class="image-editor-body">
    <canvas id="image-editor-canvas" class="image-editor-canvas"></canvas>
  </div>
</dialog>

<dialog id="deploy-dialog" class="deploy-dialog" aria-label="デプロイの確認">
  <p class="deploy-dialog-message">選択したリポジトリをデプロイしますか？</p>
  <ul id="deploy-dialog-list" class="deploy-dialog-list"></ul>
  <div class="deploy-dialog-actions">
    <button type="button" id="deploy-dialog-cancel" class="subtask-action-button">キャンセル</button>
    <button type="button" id="deploy-dialog-confirm" class="subtask-action-button primary">Deploy</button>
  </div>
</dialog>

<dialog id="cli-dialog" class="cli-dialog" aria-label="CLI実行">
  <div class="cli-dialog-header">
    <span id="cli-dialog-title" class="cli-dialog-title"></span>
    <span id="cli-dialog-status" class="cli-dialog-status" role="status"></span>
    <button type="button" id="cli-dialog-new" class="subtask-action-button">新しい会話</button>
    <button type="button" id="cli-dialog-close" class="subtask-action-button">閉じる</button>
  </div>
  <div id="cli-dialog-log" class="cli-dialog-log" aria-live="polite"></div>
  <form id="cli-dialog-form" class="cli-dialog-form">
    <textarea id="cli-dialog-input" rows="3" placeholder="Claudeへの指示（Ctrl+Enterで送信）"></textarea>
    <button type="submit" id="cli-dialog-send" class="subtask-action-button primary">送信</button>
  </form>
</dialog>

<dialog id="idea-dialog" class="cli-dialog idea-dialog" aria-label="提案一覧（アイデアマン）">
  <div class="cli-dialog-header">
    <span id="idea-dialog-title" class="cli-dialog-title"></span>
    <span id="idea-dialog-job" class="cli-dialog-status" role="status"></span>
    <label class="idea-dialog-execute"><input type="checkbox" id="idea-dialog-execute" checked />そのまま実装に進む</label>
    <button type="button" id="idea-dialog-run" class="subtask-action-button primary">アイデア出し実行</button>
    <button type="button" id="idea-dialog-close" class="subtask-action-button">閉じる</button>
  </div>
  <textarea id="idea-dialog-focus" class="idea-dialog-focus" rows="2" maxlength="1000" aria-label="アイデアを出してほしい観点"
    placeholder="アイデアを出してほしい観点（任意）　例：テスト不足の箇所、エラー処理の抜け漏れ"></textarea>
  <div id="idea-dialog-tabs" class="idea-dialog-tabs" role="group" aria-label="提案の状態"></div>
  <p id="idea-dialog-message" class="idea-dialog-message" role="status"></p>
  <div id="idea-dialog-list" class="cli-dialog-log idea-dialog-list" aria-live="polite"></div>
</dialog>

<script src="/static/image_editor.js"></script>
<script src="/static/cli_dialog.js"></script>
<script src="/static/idea_dialog.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
