<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Claude管理塔</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <h1>Claude管理塔</h1>
  <nav id="breadcrumb" aria-label="パンくず"></nav>
  <div id="worker-status" aria-label="ワーカー稼働状況"></div>
</header>

<main id="project-view" aria-label="リポジトリ一覧">
  <section>
    <h2>リポジトリ一覧</h2>
    <ul id="project-list-items"></ul>
  </section>
</main>

<main id="issue-view" hidden>
  <section id="issue-list" aria-label="タスク一覧">
    <h2>タスク一覧</h2>
    <form id="issue-create-form">
      <input type="text" name="title" placeholder="タイトル" required />
      <textarea name="body" placeholder="本文（任意）"></textarea>
      <button type="submit">タスクを追加</button>
      <p id="issue-create-status" class="empty"></p>
    </form>
    <ul id="issue-list-items"></ul>
  </section>
  <section id="subtask-list" aria-label="サブタスク一覧">
    <h2>サブタスク一覧</h2>
    <div id="subtask-list-body">
      <p class="empty">左の一覧からタスクを選択してください。</p>
    </div>
  </section>
  <section id="subtask-detail" aria-label="サブタスク詳細">
    <h2>サブタスク詳細</h2>
    <div id="subtask-detail-body">
      <p class="empty">サブタスクを選択してください。</p>
    </div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
