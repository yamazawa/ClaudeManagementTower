<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Claude管理塔</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <h1>Claude管理塔</h1>
  <div id="worker-status" aria-label="ワーカー稼働状況"></div>
</header>
<main>
  <section id="issue-list" aria-label="Issue一覧">
    <h2>Issue一覧</h2>
    <ul id="issue-list-items"></ul>
  </section>
  <section id="issue-detail" aria-label="Issue詳細">
    <h2>Issue詳細</h2>
    <div id="issue-detail-body">
      <p class="empty">左の一覧からIssueを選択してください。</p>
    </div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
