<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Claude管理塔</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <div class="header-top">
    <h1>Claude管理塔</h1>
    <div id="system-controls" aria-label="サーバー操作">
      <span id="system-status" role="status"></span>
      <button type="button" id="start-workers-button">ワーカー起動</button>
      <button type="button" id="cleanup-workers-button">ワーカー掃除</button>
      <button type="button" id="restart-server-button">サーバー再起動</button>
      <button type="button" id="sync-self-button" class="danger-action">マージして最新化</button>
    </div>
  </div>
  <nav id="breadcrumb" aria-label="パンくず"></nav>
  <div id="worker-status" aria-label="ワーカー稼働状況"></div>
</header>

<main id="project-view" aria-label="リポジトリ一覧">
  <section>
    <h2>リポジトリ一覧</h2>
    <ul id="project-list-items"></ul>
  </section>
</main>

<main id="issue-view" hidden>
  <section id="issue-list" aria-label="Issue一覧">
    <h2 id="repo-heading" class="title-heading">Repo</h2>
    <label class="list-filter">
      表示
      <select id="issue-filter">
        <option value="open" selected>未解決</option>
        <option value="closed">完了</option>
        <option value="all">全部</option>
      </select>
    </label>
    <form id="issue-create-form">
      <input type="text" name="title" placeholder="タイトル" required />
      <button type="submit">作成</button>
      <p id="issue-create-status" class="empty"></p>
    </form>
    <ul id="issue-list-items"></ul>
  </section>
  <section id="subtask-list" aria-label="Issue内容">
    <h2 id="issue-heading" class="title-heading">Issue</h2>
    <div id="subtask-list-body">
      <p class="empty">左の一覧からIssueを選択してください。</p>
    </div>
    <div id="subtask-panel" hidden>
      <h3 class="section-heading section-heading-with-filter">
        MR一覧
        <select id="subtask-filter" class="heading-filter" aria-label="MR一覧の表示フィルタ">
          <option value="unresolved" selected>未解決</option>
          <option value="draft">Draft</option>
          <option value="in_review">レビュー中</option>
          <option value="merged">マージ済</option>
          <option value="all">全部</option>
        </select>
      </h3>
      <div id="subtask-list-container"></div>
      <form id="subtask-form">
        <input type="text" name="title" placeholder="タイトル" required />
        <button type="submit">作成</button>
        <p id="subtask-form-status" class="empty"></p>
      </form>
    </div>
  </section>
  <section id="subtask-detail" aria-label="MR内容">
    <h2 id="subtask-heading" class="title-heading">MR</h2>
    <div id="subtask-detail-body">
      <p class="empty">MRを選択してください。</p>
    </div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
